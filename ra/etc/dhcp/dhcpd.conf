default-lease-time 300;
max-lease-time 300;
authoritative;

# LAN A
subnet 10.0.0.0 netmask 255.254.0.0 {
    range 10.0.0.10 10.0.0.100;
    option routers 10.1.255.254;
    option domain-name-servers 10.0.0.1;
    option domain-name "selvent.izo";
}

# IP fija: HA1
host ha {
    hardware ethernet 00:00:00:00:0a:01;
    fixed-address 10.0.0.1;
}

# IP fija: HA2
host ha2 {
    hardware ethernet 00:00:00:00:0a:02;
    fixed-address 10.0.0.2;
} 
